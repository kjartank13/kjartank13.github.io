<!DOCTYPE html>
<html lang="is">

<head>
    <meta charset="UTF-8" />
    <meta name="description"
        content="Litrófan is an independently organized queer and neurodivergent art market based in Reykjavík. Join us for community, creativity, and connection." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Litrófan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">

    <meta property="og:title" content="Litrófan – Queer Art Market in Reykjavík" />
    <meta property="og:description" content="An independent queer and neurodivergent art market in Reykjavík. Join us for art, events, and community!" />
    <meta property="og:image" content="https://litrofan.is/assets/banner.png" />
    <meta property="og:url" content="https://litrofan.is" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Litrófan – Queer Art Market in Reykjavík" />
    <meta name="twitter:description" content="An independent queer and neurodivergent art market in Reykjavík." />
    <meta name="twitter:image" content="https://litrofan.is/assets/banner.png" />

    <meta name="google-site-verification" content="K8gBet_z1QI1fIyE1X5qvg543WrKM2T7lNhsgoqZ3TY" />

</head>

<body>
    <div class="spectrum-bar" aria-hidden="true"></div>

    <header class="site-header">
        <div class="language-switcher" role="group" aria-label="Language">
            <button id="lang-is" class="lang-toggle selected" type="button">IS</button>
            <button id="lang-en" class="lang-toggle" type="button">EN</button>
        </div>
    </header>

    <main class="container">
        <!-- Banner -->
        <h1 class="hero">
            <img src="assets/banner.png" class="banner" alt="Litrófan queer art market banner in Reykjavík" />
        </h1>

        <!-- Tab buttons -->
        <div class="tabs">
            <nav class="tab-buttons" aria-label="Sections">
                <button class="tab-button active" data-tab="tab1" data-i18n="tabs.about"></button>
                <button class="tab-button" data-tab="tab-news" data-i18n="tabs.news"></button>
                <button class="tab-button" data-tab="tab2" data-i18n="tabs.artists" hidden></button>
                <button class="tab-button" data-tab="tab3" data-i18n="tabs.events"></button>
                <button class="tab-button" data-tab="tab4" data-i18n="tabs.help"></button>
            </nav>

            <!-- Tab 1: About -->
            <section class="tab-content active" id="tab1">
                <h2 data-i18n="about.title"></h2>
                <p data-i18n="about.p1"></p>
                <p data-i18n="about.p2"></p>
            </section>

            <!-- News: loaded from a published Google Sheet (see NEWS_CSV_URL in script.js) -->
            <section class="tab-content" id="tab-news">
                <h2 data-i18n="news.title"></h2>
                <div class="news-list" id="news-list"></div>
            </section>

            <!-- Tab 2: Artists -->
            <section class="tab-content" id="tab2">
                <h2 data-i18n="artists.title"></h2>
                <ul class="artist-list" id="artist-list">
                    <!-- Artists will be injected here -->
                </ul>
            </section>

            <!-- Tab 3: Events -->
            <section class="tab-content" id="tab3">
                <h2 data-i18n="events.title"></h2>
                <div class="card event-card">
                    <i class="fa-regular fa-calendar card-icon" aria-hidden="true"></i>
                    <div>
                        <p data-i18n="events.date"></p>
                        <!-- <a href="https://www.facebook.com/events/1495903845101944" aria-label="Litrófan art market Facebook event" class="event-link"
                            data-i18n="events.linkText"></a> -->
                    </div>
                </div>
            </section>

            <!-- Tab 4: Help -->
            <section class="tab-content" id="tab4">
                <h2 data-i18n="help.title"></h2>
                <p data-i18n="help.p1"></p>
                <p data-i18n="help.p2"></p>
                <ul class="card-list">
                    <li class="card">
                        <i class="fa-solid fa-building-columns card-icon" aria-hidden="true"></i>
                        <span data-i18n="help.bankInfo"></span>
                    </li>
                    <li class="card">
                        <i class="fa-solid fa-bag-shopping card-icon" aria-hidden="true"></i>
                        <span>
                            <span data-i18n="help.store1"></span>
                            <a href="https://blekotek.is/blogs/news/litrofan-listamarkaur" class="event-link"
                                data-i18n="help.storeLink"></a>
                        </span>
                    </li>
                </ul>
                <p data-i18n="help.p3"></p>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="social-links">
            <a href="https://instagram.com/litrofanartmarket" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="mailto:litrofan@litrofan.is" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
        <p class="footer-links"><a href="https://blekotek.is">Blekótek</a></p>
        <p class="copyright">&copy; 2025 Litrófan</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
